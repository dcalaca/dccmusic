name: Spain market source patch

on:
  push:
    branches: [feat/spain-market]
    paths: ['.github/workflows/spain-market-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spain-market
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Spain market source
        shell: python
        run: |
          from pathlib import Path

          studio = Path('app/compositores/admin/studio-ia/novo/page.tsx')
          s = studio.read_text()
          s = s.replace("  'Español (México)',\n]", "  'Español (México)',\n  'Español (España)',\n]")
          s = s.replace("const unitedStatesStyles = [", "const spainStyles = [\n  'Flamenco',\n  'Flamenco pop',\n  'Rumba flamenca',\n  'Pop español',\n  'Rock español',\n  'Indie español',\n  'Cantautor',\n  'Copla',\n  'Reggaetón',\n  'Urbano latino',\n  'Electrónica',\n  ...commonSpanishStyles,\n]\nconst unitedStatesStyles = [")
          s = s.replace("const mexicoStyleOptions = [...mexicoStyles, customStyleOptionEs]\n", "const mexicoStyleOptions = [...mexicoStyles, customStyleOptionEs]\nconst spainStyleOptions = [...spainStyles, customStyleOptionEs]\n")
          s = s.replace("  if (country === 'MX') {\n    return { language: 'Español (México)', defaultStyle: 'Regional mexicano', styleOptions: mexicoStyleOptions, isSpanish: true }\n  }", "  if (country === 'MX') {\n    return { language: 'Español (México)', defaultStyle: 'Regional mexicano', styleOptions: mexicoStyleOptions, isSpanish: true }\n  }\n  if (country === 'ES') {\n    return { language: 'Español (España)', defaultStyle: 'Flamenco pop', styleOptions: spainStyleOptions, isSpanish: true }\n  }")
          s = s.replace("  const isMexico = country === 'MX'\n", "  const isMexico = country === 'MX'\n  const isSpain = String(country) === 'ES'\n")
          s = s.replace(": isMexico ? 'Ej.: corrido romántico con sierreño' : isPortugal ? 'Ex.: fado pop contemporâneo' : 'Ex: piseiro romântico'", ": isMexico ? 'Ej.: corrido romántico con sierreño' : isSpain ? 'Ej.: flamenco pop con guitarra española' : isPortugal ? 'Ex.: fado pop contemporâneo' : 'Ex: piseiro romântico'")
          studio.write_text(s)

          admin = Path('app/admin/precos/page.tsx')
          a = admin.read_text()
          a = a.replace("  { code: 'PT', label: 'Portugal', flag: '🇵🇹' },\n  { code: 'US'", "  { code: 'PT', label: 'Portugal', flag: '🇵🇹' },\n  { code: 'ES', label: 'Espanha', flag: '🇪🇸' },\n  { code: 'US'")
          a = a.replace("BR: 'BRL', PY: 'PYG', CO: 'COP', MX: 'MXN', PT: 'EUR', US: 'USD',", "BR: 'BRL', PY: 'PYG', CO: 'COP', MX: 'MXN', PT: 'EUR', ES: 'EUR', US: 'USD',")
          admin.write_text(a)

          wf = Path('.github/workflows/spain-market-patch.yml')
          wf.unlink()
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add Spain Studio genres and pricing admin"
          git push origin HEAD:feat/spain-market
